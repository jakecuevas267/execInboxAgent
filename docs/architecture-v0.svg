<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="600" fill="#FAF9F5"/>
  <text x="40" y="38" font-size="20" font-weight="bold" fill="#1a1a1a">v0 — naive pipeline</text>
  <text x="40" y="60" font-size="13" fill="#666">baseline: 40/50 checks pass · failure clusters: hallucinated delegate addresses, identity paranoia</text>

  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#666" stroke-width="1.6"/></marker></defs>

  <rect x="60" y="84" width="240" height="52" rx="6" fill="#EDEBE3" stroke="#999"/>
  <text x="180" y="106" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Email input</text>
  <text x="180" y="125" font-size="12" fill="#555" text-anchor="middle">eval runner · CLI (dict in)</text>

  <text x="180" y="172" font-size="13" font-weight="bold" fill="#B3261E" text-anchor="middle">no gateway scan</text>
  <line x1="180" y1="136" x2="180" y2="186" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="60" y="190" width="240" height="72" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="180" y="214" font-size="15" font-weight="bold" fill="#26215C" text-anchor="middle">Agent node (Claude)</text>
  <text x="180" y="233" font-size="12" fill="#3C3489" text-anchor="middle">no sender profile —</text>
  <text x="180" y="249" font-size="12" fill="#3C3489" text-anchor="middle">model guesses who it's talking to</text>

  <rect x="380" y="190" width="200" height="52" rx="6" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="480" y="212" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">calendar_lookup</text>
  <text x="480" y="231" font-size="12" fill="#3C3489" text-anchor="middle">returns RAW blocks</text>
  <line x1="300" y1="216" x2="376" y2="216" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="640" y="190" width="190" height="52" rx="6" fill="#FAECE7" stroke="#993C1D"/>
  <text x="735" y="212" font-size="14" font-weight="bold" fill="#4A1B0C" text-anchor="middle">calendar.json</text>
  <text x="735" y="231" font-size="12" fill="#712B13" text-anchor="middle">fixture</text>
  <line x1="580" y1="216" x2="636" y2="216" stroke="#993C1D" stroke-width="1.2" marker-end="url(#ar)"/>

  <text x="480" y="268" font-size="13" font-weight="bold" fill="#B3261E" text-anchor="middle">model does the interval math itself</text>

  <line x1="180" y1="262" x2="180" y2="296" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="60" y="300" width="480" height="86" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="300" y="324" font-size="15" font-weight="bold" fill="#412402" text-anchor="middle">"Facts" — partly the model's word</text>
  <text x="300" y="345" font-size="12.5" fill="#854F0B" text-anchor="middle">conflict = model's protected_block_conflict CLAIM</text>
  <text x="300" y="363" font-size="12.5" fill="#854F0B" text-anchor="middle">delegate address = whatever text the model wrote</text>
  <text x="300" y="381" font-size="12.5" fill="#854F0B" text-anchor="middle">suspicion flags = only what the model noticed</text>

  <text x="640" y="330" font-size="13" font-weight="bold" fill="#B3261E">what the evals caught here:</text>
  <text x="640" y="350" font-size="12.5" fill="#B3261E">· marcus@meridianlogistics.com (invented)</text>
  <text x="640" y="368" font-size="12.5" fill="#B3261E">· real COO escalated as a "spoof"</text>
  <text x="640" y="386" font-size="12.5" fill="#B3261E">· (interval math: 0 errors — surprise)</text>

  <line x1="300" y1="386" x2="300" y2="420" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="60" y="424" width="480" height="58" rx="6" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="300" y="448" font-size="15" font-weight="bold" fill="#04342C" text-anchor="middle">Governance engine (pure Python)</text>
  <text x="300" y="468" font-size="12.5" fill="#085041" text-anchor="middle">already deterministic in v0 — unauthorized actions: 0 even here</text>

  <line x1="180" y1="482" x2="140" y2="516" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="300" y1="482" x2="300" y2="516" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="420" y1="482" x2="460" y2="516" stroke="#666" stroke-width="1.2" marker-end="url(#ar)"/>

  <rect x="60" y="520" width="160" height="48" rx="6" fill="#EAF3DE" stroke="#3B6D11"/>
  <text x="140" y="540" font-size="13.5" font-weight="bold" fill="#173404" text-anchor="middle">auto: executed</text>
  <text x="140" y="558" font-size="12" fill="#27500A" text-anchor="middle">archive · decline</text>
  <rect x="240" y="520" width="160" height="48" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="320" y="540" font-size="13.5" font-weight="bold" fill="#412402" text-anchor="middle">hitl: queued</text>
  <text x="320" y="558" font-size="12" fill="#633806" text-anchor="middle">human approves</text>
  <rect x="420" y="520" width="160" height="48" rx="6" fill="#FCEBEB" stroke="#A32D2D"/>
  <text x="500" y="540" font-size="13.5" font-weight="bold" fill="#501313" text-anchor="middle">deny: refused</text>
  <text x="500" y="558" font-size="12" fill="#791F1F" text-anchor="middle">final in code</text>
</svg>
